<html>
  <head>
    <title>Owls hoot.</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets\lalua-removebg-preview.png" />

    <style>
      html {
        background-color: black;
        color: white;
        text-align: center;
      }

      h1 {
        margin: 0px;
        padding: 0px;
        font-size: 50px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", (event) => {
        theTimeSince = (Date.now() - localStorage.getItem("msLastTime")) / 1000;
        if (theTimeSince >= 3600) {
          theTimeSince = Math.round(theTimeSince / 3600);
          if (theTimeSince === 1) {
            theTimeSince = theTimeSince + " hour";
          } else {
            theTimeSince = theTimeSince + " hours";
          }
        } else if (theTimeSince >= 60) {
          theTimeSince = Math.round(theTimeSince / 60);
          if (theTimeSince === 1) {
            theTimeSince = theTimeSince + " minute";
          } else {
            theTimeSince = theTimeSince + " minutes";
          }
        } else if (Math.round(theTimeSince) === 1) {
          theTimeSince = Math.round(theTimeSince) + " second";
        } else {
          theTimeSince = Math.round(theTimeSince) + " seconds";
        }

        document.getElementById("timeSince").innerHTML = theTimeSince + " ago.";
        localStorage.setItem("msLastTime", Date.now());
      });
    </script>
  </head>

  <body>
    <span style="position: fixed; top: 0px; left: 5px; text-align: left"
      >/nighttime.html</span
    >
    <h1>Hello.</h1>
    <img src="assets\lalua-removebg-preview.png" style="height: 200px" />
    <h1 style="position: fixed; bottom: 10px; left: 10px">
      Last visited
      <span id="timeSince" style="font-style: italic">just now.</span>
    </h1>
  </body>
</html>
