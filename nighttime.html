<html>
  <head>
    <title>Owls hoot.</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets\lalua-removebg-preview.png" />

    <style>
      html {
        background-color: black;
        color: white;
        text-align: center;
      }

      h1 {
        margin: 0px;
        padding: 0px;
        font-size: 50px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", (event) => {
        if (localStorage.getItem("msLastTime")) {
          document.getElementById("welcome").innerHTML = "Welcome back.";
          theTimeSince =
            (Date.now() - localStorage.getItem("msLastTime")) / 1000;
          if (theTimeSince >= 86400) {
            theTimeSince = Math.round(theTimeSince / 86400);
            if (theTimeSince === 1) {
              theTimeSince = theTimeSince + " day";
            } else {
              theTimeSince = theTimeSince + " days";
            }
          } else if (theTimeSince >= 3600) {
            theTimeSince = Math.round(theTimeSince / 3600);
            if (theTimeSince === 1) {
              theTimeSince = theTimeSince + " hour";
            } else {
              theTimeSince = theTimeSince + " hours";
            }
          } else if (theTimeSince >= 60) {
            theTimeSince = Math.round(theTimeSince / 60);
            if (theTimeSince === 1) {
              theTimeSince = theTimeSince + " minute";
            } else {
              theTimeSince = theTimeSince + " minutes";
            }
          } else if (Math.round(theTimeSince) === 1) {
            theTimeSince = Math.round(theTimeSince) + " second";
          } else {
            theTimeSince = Math.round(theTimeSince) + " seconds";
          }
          document.getElementById("timeSince").innerHTML =
            theTimeSince + " ago.";
        } else {
          document.getElementById("lastVisited").classList.add("hidden");
        }

        localStorage.setItem("msLastTime", Date.now());
      });
    </script>
  </head>

  <body>
    <span style="position: fixed; top: 0px; left: 5px; text-align: left"
      >/nighttime.html</span
    >
    <h1 id="welcome">Welcome.</h1>
    <img src="assets\la_lua.png" style="height: 400px" />
    <h1 id="lastVisited" style="position: fixed; bottom: 10px; left: 10px">
      Last visited
      <span id="timeSince" style="font-style: italic"></span>
    </h1>
  </body>
</html>
