name: Auto Edit File on Commit

on:
  push:
    branches:
      - main # Change to your default branch name if different

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push edits back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Octokit
        run: npm install @octokit/rest

      - name: Run JavaScript Edit Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/edit-file.js
