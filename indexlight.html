<!doctype html>
<html>
  <head>
    <style>
      html {
        background-image: url(assets/windows_xp_14.jpg);
        background-repeat: no-repeat;
        background-size: cover;
      }
    </style>

    <script>
      async function setTheme(enableLightMode) {
        // 1. Tell Cloudflare Worker to update the cookie to "true" or "false"
        await fetch(`/api/set-theme?mode=${enableLightMode}`);

        // 2. Reload the page so Cloudflare serves the corresponding HTML (index.html vs indexlight.html)
        window.location.reload();
      }
    </script>
  </head>

  <body id="main">
    <img
      src="assets/darkbulb.png"
      style="position: fixed; top: -100px; right: 218px; cursor: pointer"
      id="lightbulb"
      onclick="setTheme(false)"
      title="Turn off the lights?"
    />
    <span
      style="
        position: fixed;
        top: 10px;
        left: 10px;
        text-align: left;
        font-size: 20px;
        font-family: Cascadia Mono;
      "
      >/index.html</span
    >
    <h3>Welcome to light mode.</h3>
  </body>
</html>
