<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Light Mode Site</title>
  </head>
  <body>
    <h1>Welcome to the Light Theme!</h1>

    <button id="theme-toggle">Switch to Dark Mode</button>

    <script>
      async function setTheme(enableLightMode) {
        // Send API request to Cloudflare Worker to set cookie via HTTP header
        await fetch(`/api/set-theme?mode=${enableLightMode}`);

        // Reload the page so the Worker serves index.html instead of indexlight.html
        window.location.reload();
      }

      // Attach event listener to the button
      document.getElementById("theme-toggle").addEventListener("click", () => {
        setTheme(false); // Set lightMode to false
      });
    </script>
  </body>
</html>
