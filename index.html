<!doctype html>
<html>
  <head>
    <style>
      #welcomeBorder {
        border-left: 1px solid #7394e4;
        height: 500px;
        position: fixed;
        border-radius: 100%;
      }

      html {
        overflow: hidden;
      }

      #lightSide:hover {
        background-color: cyan;
      }

      #darkSide:hover {
        background-color: red;
      }

      #lightSide,
      #darkSide {
        /* Smoothly interpolates background color changes over 0.2 seconds */
        transition: background-color 0.2s ease-in-out;
      }
    </style>
  </head>

  <body>
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: row;
        min-height: 100vh;
        gap: 100px;
      "
    >
      <div
        id="lightSide"
        style="
          display: flex;
          justify-content: center; /* aligns vertically */
          /* align-items: center;  aligns horizontally */
          min-height: 80vh;
          min-width: 40vw;
        "
      >
        <div style="display: flex; flex-direction: column">
          <p>Online:</p>
        </div>
      </div>

      <div
        id="darkSide"
        style="
          display: flex;
          justify-content: center;
          /* align-items: center; */
          min-height: 80vh;
          min-width: 40vw;
        "
      >
        <div style="display: flex; flex-direction: column">
          <p>Offline:</p>
        </div>
      </div>
    </div>
  </body>
</html>
