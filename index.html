<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <style>
      #welcomeBorder {
        border-left: 1px solid #7394e4;
        height: 500px;
        position: fixed;
        border-radius: 100%;
      }

      html {
        overflow: hidden;
        user-select: none;
      }

      /* div {
        border: 1px solid black;
      } */

      p {
        margin: 0;
      }

      #darkSide:hover {
        opacity: 0 !important;
      }

      #darkSide {
        transition: opacity 0.2s ease-in-out;
        opacity: 0.4;
      }

      #lightSide {
        opacity: 0.4;
        pointer-events: none;
        transition: opacity 0.2s ease-in-out;
      }

      #lightButton:hover ~ #lightSide,
      body:has(#lightButton:hover) #lightSide {
        opacity: 0;
      }

      #lightButton:hover {
        border-style: inset !important;
      }

      #lightButton a:hover {
        color: cyan !important;
        text-shadow: 2px 2px #008080 !important;
      }
    </style>
    <script></script>
  </head>

  <body>
    <div
      style="
        position: fixed;
        min-width: 50vw;
        min-height: 100vh;
        top: 0px;
        left: 0px;
        background-color: #008080;
        z-index: -1;
      "
    ></div>
    <div
      style="
        position: fixed;
        min-width: 50vw;
        min-height: 100vh;
        top: 0px;
        right: 0px;
        background-color: #008080;
        z-index: -1;
      "
    ></div>
    <div
      id="lightSide"
      style="
        position: fixed;
        min-width: 50vw;
        min-height: 100vh;
        top: 0px;
        left: 0px;
        background-color: black;
        z-index: 1;
      "
    ></div>

    <div
      id="darkSide"
      style="
        position: fixed;
        min-width: 50vw;
        min-height: 100vh;
        top: 0px;
        right: 0px;
        background-color: black;
        z-index: 1;
      "
    ></div>
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: row;
        min-height: 100vh;
        gap: 10vw;
      "
    >
      <div
        id="lightButton"
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          min-width: 40vw;
          background-color: #008080;
          background-image: url(assets/perfect_hue_16.jpg);
          background-repeat: no-repeat;
          color: #008080;
          text-align: center;
          min-height: 12vh;
          position: relative;
          border: 5px 5px 5px 5px;
          border-style: outset;
        "
      >
        <p style="font-family: Arial Narrow Bold Italic; font-size: 32px">
          <a
            style="text-shadow: 2px 2px white"
            href="https://online.heycallie.net"
            >go Online?</a
          >
        </p>

        <img
          src="assets/Windows_Logo_(1992-2001).svg"
          style="position: absolute; left: 3px; height: 64px"
        />
        <img
          src="assets/mikuwave.gif"
          style="position: absolute; right: 11px; bottom: 0px; height: 64px"
        />
        <img
          src="assets/nukoMarioStar.gif"
          style="position: absolute; right: 28px; bottom: 52px; height: 26px"
        />
        <img
          src="assets/dolphspin.gif"
          style="position: absolute; right: 125px; bottom: 8px; height: 86px"
        />
        <img
          src="assets/angelpeace.gif"
          style="position: absolute; left: 130px; bottom: 0px; height: 86px"
        />
        <img
          src="assets/cirnodance.gif"
          style="position: absolute; left: 100px; top: 20px; height: 50px"
        />
      </div>

      <div
        id="darkButton"
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          min-width: 40vw;
          background-color: #008080;
          background-image: url(assets/starback2.gif);
          background-repeat: repeat;
          color: #800000;
          text-align: center;
          min-height: 12vh;
          position: relative;
        "
      >
        <p style="font-family: Arial Narrow Bold Italic; font-size: 32px">
          <span style="text-shadow: 2px 2px white">go Offline?</span>
        </p>
      </div>
    </div>
  </body>
</html>
